[package]
name = "habits-axum"
version = "1.99.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "tracing"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum-extra = { version = "0.12.6", features = ["cookie"]}
bcrypt = "0.19.3"
jsonwebtoken = {version = "11.1.0", features = ["rust_crypto"]}
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
cookie = "0.18.2"
serde_path_to_error = "0.1.20"
uuid = { version = "1.29.2", features = ["v4"] }
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
futures-util = "0.3.34"
console-subscriber = "0.5.0"
jiff = { version = "0.2.41", features = ["serde"] }
jiff-sqlx = { version = "0.1.0", features = ["postgres"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "socks"] }

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.5"
tokio-tungstenite = "0.29.0"
